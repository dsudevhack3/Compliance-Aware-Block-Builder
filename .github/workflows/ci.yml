name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Compliance Engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: compliance_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy lint check
        run: cargo clippy -- -D warnings

      - name: Initialize database schema & seeds
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/schema.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/seed.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/seed_addresses.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/seed_entities.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/seed_policies.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/migrations/001_phase1_hardening.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/migrations/002_edd_cases.sql
          PGPASSWORD=password psql -h localhost -U postgres -d compliance_builder -f ../db/migrations/003_relay_ai_summary.sql

      - name: Run test suite (unit + live DB/Redis integration)
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/compliance_builder
          REDIS_URL: redis://localhost:6379
        run: cargo test

  api:
    name: Orchestration API (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

  ai-explainer:
    name: AI Explainer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-explainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-explainer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and import compilation check
        run: python -m py_compile main.py

  relay:
    name: Relay Service (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --all-features -- --nocapture
