[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.4.1", features = ["full"] }
eyre = "0.6.14"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
revm = "43.0.0"
